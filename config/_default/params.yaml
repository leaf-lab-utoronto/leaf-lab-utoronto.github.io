# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: theme_leaf_lab_v2
  font: font_roboto
  font_size: S

# SEO

marketing:
  seo:
    site_type: Organization
    local_business_type: ''
    org_name: 'LEAF Lab, within the University of Toronto Institute for Aerospace Science'
    description: 'The website of the Learning, Embodied Autonomy, and Forecasting (LEAF) research laboratory.'
    twitter: 'nick_rhinehart'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: ''
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: true
    show_day_night: false
    show_search: true
    highlight_active_link: true  

# 
i_am_a_sponsor: true
power_ups:
  hide_published_with: true
# Site footer

footer:
  block: minimal
  copyright:
    notice: '
    <div class="universal-wrapper">
    <hr class="footer-rule"></hr>
    <div class="row footer-logos">
      <a href="#"><img src="/images/logo.png" alt="LEAF Lab logo"></a>
      <div class="footer-logo-divider"></div>
      <a href="https://robotics.utoronto.ca" target="_blank"><img src="/images/ri-logo.png" alt="U of T Robotics Institute Logo"></a>
      <div class="footer-logo-divider"></div>
      <a href="https://utoronto.ca" target="_blank"><img src="/images/uot-logo.png" alt="U of T Logo"></a>
    </div>
    <p class="footer-copyright">© {year} Nick Rhinehart.</p></div>'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: true
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: square
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006
  citation_style: mla
