{{- define "main" -}}
{{ partial "page_header.html" . }}

<div class="universal-wrapper">
  {{ with .Content }}
  <div class="article-style">{{ . }}</div>
  {{ end }}

  <div class="compact-news-list">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "views/event_list.html" (dict "item" .) }}
    {{ end }}
  </div>
</div>
{{- end -}}
